[package]
name = "lgv2"
version = "2.2.1"
edition = "2021"
description = "LG v2.1/v2.2 混淆引擎 + 五短板补全"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
