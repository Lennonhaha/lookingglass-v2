[package]
name = "lgv2"
version = "2.4.0"
edition = "2021"
description = "LG v2.4.0 confusion engine — variable depth + fused pass + session binding"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

